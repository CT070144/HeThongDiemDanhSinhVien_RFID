server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/rfid_attendance_system?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=phucnv
spring.datasource.password=1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://hethongdiemdanh.actvn.vn:8088,https://he-thong-diem-danh-sinh-vien-rfid.vercel.app


# JWT Configuration
jwt.secret= myScretKeyForRFIDAttendanceSystem2024VerySecureKey
jwt.expiration=86400000

# Logging
logging.level.com.rfid=DEBUG
logging.level.org.springframework.web=DEBUG

# Python face recognition service
face.python.base-url=http://localhost:5000
face.python.recognize-path=/recognize
face.python.encode-path=/encode
face.python.compare-path=/compare

# Avatar upload dir
avatar.upload-dir=uploads/avatars

# Attendance photo upload dir
attendance.upload-dir=uploads/attendance

# Timezone Configuration
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
